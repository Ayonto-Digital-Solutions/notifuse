# ═══════════════════════════════════════════════════════════════
# Upstream-Sync: Ayonto-Fork von Notifuse
# ═══════════════════════════════════════════════════════════════
#
# Merged taeglich Notifuse/notifuse (main) in ayonto-branding.
# Der Image-BUILD laeuft NICHT hier, sondern im Repo
# ayonto-newsletter (build-and-push.yml, taeglich 05:00 UTC) —
# dessen GITHUB_TOKEN besitzt das GHCR-Paket ayonto-newsletter.
#
# Fork-Delta (bewusst minimal): pkg/mailer/translations.go
# ("Notifuse" -> "Ayonto Pulse", System-Mail-Texte).
#
# .github/workflows/ wird NICHT gesynct: Das GITHUB_TOKEN kann keine
# Workflow-Dateien schreiben (einen `workflows`-Scope gibt es fuer diesen
# Token nicht — nur PATs/GitHub-Apps haben ihn), der Push wuerde komplett
# rejected. Die von Upstream geerbten Workflows laufen im Fork ohnehin nie:
# GitHub registriert geerbte Fork-Workflows nicht, aktiv ist allein dieser
# Sync. Sie bleiben daher auf Fork-Stand eingefroren.
#
# Bei Merge-Konflikt schlaegt der Run fehl -> lokal aufloesen:
#   git fetch upstream && git merge upstream/main && git push

name: Upstream-Sync

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ayonto-branding
          fetch-depth: 0

      - name: Upstream mergen
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Notifuse/notifuse.git
          git fetch upstream main

          BEFORE="$(git rev-parse HEAD)"

          # --no-ff: erzwingt einen eigenen Merge-Commit, damit das spaetere
          # --amend garantiert unseren Commit trifft und nie einen von Upstream.
          if ! git merge --no-ff upstream/main -m "Merge upstream/main"; then
            UNMERGED="$(git diff --name-only --diff-filter=U)"

            # Ein fehlgeschlagener Merge ganz ohne Konfliktdateien ist kein
            # Konflikt, sondern ein anderer Fehler (z. B. verschmutzter
            # Arbeitsbaum). Ohne diesen Guard liefe das Skript weiter und
            # braeche erst beim Commit mit dem irrefuehrenden
            # "nothing to commit" ab.
            if [ -z "$UNMERGED" ]; then
              echo "::error::git merge fehlgeschlagen, aber ohne Konfliktdateien — Ursache im Log oberhalb."
              exit 1
            fi

            # Weil der Fork die Workflows eingefroren haelt, sieht jede erneute
            # Upstream-Aenderung an denselben Zeilen fuer git wie ein echter
            # Konflikt aus. Solche Konflikte gehoeren automatisch auf Fork-Stand
            # aufgeloest — nur alles ausserhalb ist ein Fall fuer einen Menschen.
            OTHER="$(echo "$UNMERGED" | grep -v '^\.github/workflows/' || true)"
            if [ -n "$OTHER" ]; then
              echo "::error::Merge-Konflikt ausserhalb .github/workflows — lokal aufloesen: git fetch upstream && git merge upstream/main"
              echo "$OTHER"
              exit 1
            fi

            # Nicht per Datei mit `git checkout --ours` aufloesen: bei einem
            # modify/delete-Konflikt (Datei im Fork geloescht, von Upstream
            # geaendert) fehlt im Index die "unsere" Stage, und der Checkout
            # bricht mit "does not have our version" ab. Stattdessen das ganze
            # Verzeichnis pauschal auf den Fork-Stand zurueckdrehen — genau das
            # ist ohnehin das gewuenschte Ergebnis (siehe Kopf).
            git rm -rfq --ignore-unmatch -- .github/workflows
            git checkout "$BEFORE" -- .github/workflows
            git add -A -- .github/workflows
            git commit --no-edit
          fi

          # Workflow-Verzeichnis exakt auf Fork-Stand zurueckdrehen (siehe Kopf).
          # Der Merge-Commit behaelt upstream/main als Parent — die uebersprungene
          # Aenderung gilt damit als gemergt und taucht beim naechsten Lauf nicht
          # wieder auf. Ohne diesen Parent wuerde der Sync jeden Tag erneut brechen.
          if ! git diff --quiet "$BEFORE" HEAD -- .github/workflows; then
            rm -rf .github/workflows
            git checkout "$BEFORE" -- .github/workflows
            git add -A .github/workflows
            git commit --amend --no-edit
            echo "::notice::.github/workflows auf Fork-Stand gehalten (GITHUB_TOKEN hat keinen workflows-Scope)."
          fi

          if [ "$(git rev-parse HEAD)" = "$BEFORE" ]; then
            echo "::notice::Bereits aktuell — nichts zu pushen."
            exit 0
          fi

          git push origin ayonto-branding
